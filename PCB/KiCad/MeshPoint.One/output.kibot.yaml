# KiBot configuration for MeshPoint.One PCB
# Full automation suite for JLCPCB production
# Features: ERC/DRC, Gerbers, BOM, 3D renders, Diff, Assembly docs

kibot:
  version: 1

globals:
  resources_dir: .
  date_format: '%Y-%m-%d'
  time_format: '%H:%M:%S'

# Preflight checks (ERC/DRC/DFM) - for KiCad 8+
# dont_stop: true allows workflow to continue and generate all outputs
# HTML reports are generated for Goran to review errors
preflight:
  # Auto-versioning: Sets project_version from CI/CD environment
  # Workflow calculates new version (V2.4 -> V2.5) when commit contains 'release'
  set_text_variables:
    - name: project_version
      command: 'echo $PROJECT_VERSION'
    - name: project_year
      command: 'echo $PROJECT_YEAR'
  erc:
    enabled: true
    dont_stop: true
    warnings_as_errors: false
    format: HTML
    dir: Reports
  drc:
    enabled: true
    dont_stop: true
    format: HTML
    dir: Reports
  # Fill zones before DRC to ensure accurate checks
  check_zone_fills: true

filters:
  - name: only_jlc_parts
    comment: "Only parts with JLC (LCSC) code"
    type: generic
    include_only:
      - column: "LCSC"
        regex: '^C\d+'

  - name: mechanical_parts
    comment: "Mechanical parts (connectors, etc)"
    type: generic
    include_only:
      - column: "Type"
        regex: 'Connector|Mechanical'

variants:
  - name: rotated
    comment: "Rotation filter for JLCPCB"
    type: kibom
    variant: rotated
    pre_transform: _rot_footprint

outputs:
  #############################################
  # JLCPCB FABRICATION FILES
  #############################################

  - name: JLCPCB_gerbers
    comment: Gerbers compatible with JLCPCB
    type: gerber
    dir: Fabrication/JLCPCB
    options:
      exclude_edge_layer: true
      exclude_pads_from_silkscreen: true
      plot_sheet_reference: false
      plot_footprint_refs: true
      plot_footprint_values: false
      force_plot_invisible_refs_vals: false
      tent_vias: true
      use_protel_extensions: true
      create_gerber_job_file: false
      disable_aperture_macros: true
      gerber_precision: 4.6
      use_gerber_x2_attributes: false
      use_gerber_net_attributes: false
      line_width: 0.1
      subtract_mask_from_silk: true
    layers:
      - F.Cu
      - B.Cu
      - F.Paste
      - B.Paste
      - F.SilkS
      - B.SilkS
      - F.Mask
      - B.Mask
      - Edge.Cuts

  - name: JLCPCB_drill
    comment: Drill files compatible with JLCPCB
    type: excellon
    dir: Fabrication/JLCPCB
    options:
      pth_and_npth_single_file: false
      pth_id: "-PTH"
      npth_id: "-NPTH"
      metric_units: false
      output: "%f%i.%x"

  - name: JLCPCB_zip
    comment: ZIP file for JLCPCB
    type: compress
    dir: Fabrication/JLCPCB
    options:
      output: '%f-JLCPCB.%x'
      files:
        - from_output: JLCPCB_gerbers
          dest: /
        - from_output: JLCPCB_drill
          dest: /

  #############################################
  # BOM AND ASSEMBLY
  #############################################

  - name: "JLCPCB_position"
    comment: "Pick and place file for JLCPCB SMT assembly"
    type: position
    dir: Fabrication/JLCPCB-Assembly
    options:
      variant: rotated
      output: "%f_cpl_jlc.%x"
      format: CSV
      units: millimeters
      separate_files_for_front_and_back: false
      only_smd: false
      columns:
        - id: Ref
          name: Designator
        - Val
        - Package
        - id: PosX
          name: "Mid X"
        - id: PosY
          name: "Mid Y"
        - id: Rot
          name: Rotation
        - id: Side
          name: Layer

  - name: "JLCPCB_bom"
    comment: "BoM for JLCPCB assembly"
    type: bom
    dir: Fabrication/JLCPCB-Assembly
    options:
      output: "%f_bom_jlc.%x"
      exclude_filter: "only_jlc_parts"
      ref_separator: ","
      columns:
        - field: Value
          name: Comment
        - field: References
          name: Designator
        - Footprint
        - field: "LCSC"
          name: "LCSC Part Number"
        - field: "Quantity Per PCB"
          name: "Qty"
      csv:
        hide_pcb_info: true
        hide_stats_info: true
        quote_all: true

  #############################################
  # INTERACTIVE BOM (Enhanced)
  #############################################

  - name: ibom
    comment: Interactive HTML BOM with PCB view
    type: ibom
    dir: Fabrication/iBOM
    options:
      dark_mode: true
      name_format: "%f-ibom"
      show_fabrication: true
      highlight_pin1: true
      include_tracks: true
      include_nets: true
      board_rotation: 0
      checkboxes: 'Placed,Verified'
      bom_view: 'left-right'
      layer_view: 'FB'
      extra_fields: 'LCSC,Manufacturer,MPN'

  #############################################
  # 3D RENDERS
  #############################################

  - name: render_3d_top
    comment: 3D render - top view
    type: render_3d
    dir: Fabrication/3D-Renders
    options:
      output: '%f-3D-top.%x'
      rotate_x: 0
      rotate_y: 0
      rotate_z: 0
      ray_tracing: true
      orthographic: false
      zoom: 4
      width: 1920
      height: 1080
      background1: "#FFFFFF"
      background2: "#FFFFFF"

  - name: render_3d_bottom
    comment: 3D render - bottom view
    type: render_3d
    dir: Fabrication/3D-Renders
    options:
      output: '%f-3D-bottom.%x'
      rotate_x: 180
      rotate_y: 0
      rotate_z: 0
      ray_tracing: true
      orthographic: false
      zoom: 4
      width: 1920
      height: 1080
      background1: "#FFFFFF"
      background2: "#FFFFFF"

  - name: render_3d_angle
    comment: 3D render - isometric view
    type: render_3d
    dir: Fabrication/3D-Renders
    options:
      output: '%f-3D-iso.%x'
      rotate_x: 30
      rotate_y: 0
      rotate_z: -20
      ray_tracing: true
      orthographic: false
      zoom: 3
      width: 1920
      height: 1080
      background1: "#FFFFFF"
      background2: "#FFFFFF"

  #############################################
  # PDF DOCUMENTATION
  #############################################

  - name: schematic_pdf
    comment: "PDF Schematic (all sheets)"
    type: pdf_sch_print
    dir: Fabrication/Documentation
    options:
      output: '%f-schematic.%x'
      color_theme: _builtin_default

  - name: pcb_pdf_assembly_top
    comment: "Assembly drawing - top layer"
    type: pcb_print
    dir: Fabrication/Documentation
    options:
      output: '%f-assembly-top.%x'
      format: PDF
      pages:
        - layers:
            - layer: F.Fab
            - layer: F.SilkS
            - layer: Edge.Cuts
          sheet: 'Assembly Top'

  - name: pcb_pdf_assembly_bottom
    comment: "Assembly drawing - bottom layer"
    type: pcb_print
    dir: Fabrication/Documentation
    options:
      output: '%f-assembly-bottom.%x'
      format: PDF
      mirror: true
      pages:
        - layers:
            - layer: B.Fab
            - layer: B.SilkS
            - layer: Edge.Cuts
          sheet: 'Assembly Bottom'

  - name: pcb_pdf_layers
    comment: "PCB layers overview"
    type: pcb_print
    dir: Fabrication/Documentation
    options:
      output: '%f-layers.%x'
      format: PDF
      pages:
        - layers:
            - layer: F.Cu
            - layer: Edge.Cuts
          sheet: 'Top Copper'
        - layers:
            - layer: B.Cu
            - layer: Edge.Cuts
          sheet: 'Bottom Copper'
          mirror: true
        - layers:
            - layer: F.SilkS
            - layer: Edge.Cuts
          sheet: 'Top Silkscreen'
        - layers:
            - layer: B.SilkS
            - layer: Edge.Cuts
          sheet: 'Bottom Silkscreen'
          mirror: true

  #############################################
  # DIFF AND VERSION TRACKING
  #############################################

  - name: pcb_diff
    comment: "PCB changes diff (requires git history)"
    type: diff
    dir: Fabrication/Diff
    options:
      output: '%f-diff.%x'
      old: 'HEAD~1'
      old_type: 'git'
      new: 'HEAD'
      new_type: 'git'
      cache_dir: '.cache'
      add_link_id: true

  #############################################
  # STEP EXPORT FOR 3D CAD
  #############################################

  - name: step_model
    comment: "STEP 3D model for CAD integration"
    type: step
    dir: Fabrication/3D-Models
    options:
      output: '%f.%x'
      download: true
      origin: 'drill'
      no_virtual: true

  #############################################
  # REPORT AND INFO
  #############################################

  - name: board_info
    comment: "Board information report"
    type: info
    dir: Fabrication/Reports
    options:
      output: '%f-info.%x'

  - name: design_report
    comment: "Design statistics report"
    type: report
    dir: Fabrication/Reports
    options:
      output: '%f-report.%x'
      template: full

  #############################################
  # COMPLETE PACKAGE
  #############################################

  - name: complete_package
    comment: "All fabrication files in one ZIP"
    type: compress
    dir: Fabrication
    options:
      output: '%f-complete-package.%x'
      files:
        - from_output: JLCPCB_zip
        - from_output: JLCPCB_bom
        - from_output: JLCPCB_position
        - from_output: ibom
        - from_output: schematic_pdf
        - from_output: pcb_pdf_assembly_top
        - from_output: pcb_pdf_assembly_bottom
        - from_output: render_3d_top
        - from_output: render_3d_bottom
        - from_output: render_3d_angle
        - from_output: board_info
